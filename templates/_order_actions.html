<form method="post" action="{% url 'order_finish' o.pk %}" class="inline">{% csrf_token %}
    <button type="submit" class="btn btn-main btn-small">Завершить</button>
</form>
<form method="post" action="{% url 'order_cancel' o.pk %}" class="inline" onsubmit="return confirm('Отменить заказ?');">{% csrf_token %}
    <button type="submit" class="btn btn-danger btn-small">Отменить</button>
</form>
